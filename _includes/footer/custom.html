<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.author.name }}",
  "url": "{{ site.url }}",
  "jobTitle": "Manager, Core Threat Protection & Intelligence",
  "worksFor": { "@type": "Organization", "name": "{{ site.author.employer }}" },
  "sameAs": [
    "{{ site.author.linkedin }}",
    "{{ site.author.googlescholar }}",
    "{{ site.author.researchgate }}"
  ]
}
</script>

<script>
  document.querySelectorAll('.js-email').forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      window.location.href = 'mailto:' + a.dataset.u + '@' + a.dataset.d;
    });
  });
</script>
